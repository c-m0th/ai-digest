name: Daily AI Digest

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 安装依赖
        run: |
          pip install --upgrade pip
          pip install anthropic feedparser youtube-transcript-api \
                      trafilatura requests PyYAML schedule \
                      jinja2 beautifulsoup4 python-dotenv yt-dlp

      # ✅ 第一个诊断步骤：检查 Secrets 是否注入
      - name: 验证 Secrets 是否注入
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: |
          [ -n "$GEMINI_API_KEY" ]    && echo "✅ GEMINI_API_KEY 已设置"    || echo "❌ GEMINI_API_KEY 未设置"
          [ -n "$DEEPSEEK_API_KEY" ]  && echo "✅ DEEPSEEK_API_KEY 已设置"  || echo "❌ DEEPSEEK_API_KEY 未设置"
          [ -n "$ANTHROPIC_API_KEY" ] && echo "✅ ANTHROPIC_API_KEY 已设置" || echo "❌ ANTHROPIC_API_KEY 未设置"
          [ -n "$OPENAI_API_KEY" ]    && echo "✅ OPENAI_API_KEY 已设置"    || echo "❌ OPENAI_API_KEY 未设置"
          [ -n "$GROQ_API_KEY" ]      && echo "✅ GROQ_API_KEY 已设置"      || echo "❌ GROQ_API_KEY 未设置"
          [ -n "$EMAIL_ADDRESS" ]     && echo "✅ EMAIL_ADDRESS 已设置"     || echo "❌ EMAIL_ADDRESS 未设置"
          [ -n "$EMAIL_PASSWORD" ]    && echo "✅ EMAIL_PASSWORD 已设置"    || echo "❌ EMAIL_PASSWORD 未设置"

      # ✅ 第二个诊断步骤：检查网络连通性
      - name: 网络连通性检测
        run: |
          echo "=== DNS 解析测试 ==="
          nslookup generativelanguage.googleapis.com || echo "❌ Gemini DNS 失败"
          nslookup api.deepseek.com                  || echo "❌ DeepSeek DNS 失败"
          nslookup api.anthropic.com                 || echo "❌ Claude DNS 失败"
          nslookup api.openai.com                    || echo "❌ OpenAI DNS 失败"

          echo "=== HTTPS 连通测试 ==="
          curl -sI --max-time 10 https://generativelanguage.googleapis.com || echo "❌ Gemini 不可达"
          curl -sI --max-time 10 https://api.anthropic.com                 || echo "❌ Claude 不可达"
          curl -sI --max-time 10 https://api.deepseek.com                  || echo "❌ DeepSeek 不可达"
          curl -sI --max-time 10 https://api.openai.com                    || echo "❌ OpenAI 不可达"
      
      # ── 写入 YouTube cookies（可选，能显著提升字幕成功率）───
      # 如果在 Secrets 中设置了 YT_COOKIES_B64，则解码写入文件
      # 如何获取 cookies：见下方说明
      - name: 写入 YouTube Cookies（如已配置）
        env:
          YT_COOKIES_B64: ${{ secrets.YT_COOKIES_B64 }}
        run: |
          if [ -n "$YT_COOKIES_B64" ]; then
            echo "$YT_COOKIES_B64" | base64 -d > /tmp/yt_cookies.txt
            echo "✅ YouTube cookies 已写入 /tmp/yt_cookies.txt"
            echo "YT_COOKIES_FILE=/tmp/yt_cookies.txt" >> $GITHUB_ENV
          else
            echo "ℹ️  未配置 YT_COOKIES_B64，以匿名方式抓取（字幕成功率较低）"
          fi
      
      - name: 恢复去重数据库缓存
        uses: actions/cache@v4
        with:
          path: data/digest.db
          key: digest-db-${{ github.run_number }}
          restore-keys: digest-db-

      # ✅ 正式运行
      - name: 运行摘要助理
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python main.py --run-now
