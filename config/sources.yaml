# ============================================================
# config/sources.yaml  订阅源配置
# 方向：心磁 / 脑磁 / 心电 / 脑电 + 信号处理、物理建模与相关 AI
# 复制为 sources.yaml 后按需注释/删除不需要的条目
# ============================================================

settings:
  max_items_per_source: 3          # 每个来源最多处理几条（源多时建议 2-3）
  max_content_chars: 12000         # 送入 Claude 的最大字符数
  days_lookback: 1                 # 只看最近几天的内容
  language_hint: "中文输出，简洁，准确，专业术语保留英文原文"


# ═══════════════════════════════════════════════════════════
# 一、YouTube 频道
# ═══════════════════════════════════════════════════════════

youtube:

  # ── 心脑信号处理 / 方法课程与学术讲座 ──────────────────

  - name: "MNE-Python"
    channel_id: "UCMH3gJyy3tNL0Wui7aoUjIA"          # EEG/MEG 处理、配准与源空间分析

  - name: "FieldTrip Toolbox"
    channel_id: "UCzB9pvyHL3uNpzN1Iz_cOjA"          # EEG/MEG 实验、时频分析与源定位

  - name: "EEGLAB and EEG Neurotech"
    channel_id: "UCK8x1bdiHWmT0yCNEjTcEvA"          # EEG 预处理、ICA 与时频分析

  - name: "CuttingEEG"
    channel_id: "UCMIYoORlCnvo9bahMCPF0PQ"          # EEG/MEG 方法会议与研究讲座


# ═══════════════════════════════════════════════════════════
# 二、RSS 博客 / Newsletter
# ═══════════════════════════════════════════════════════════

rss_blogs:

  # ── PubMed 关键词定向论文订阅 ──────────────────────────
  # 使用标题/摘要约束研究对象，补充未上传 arXiv 的期刊论文
  # description 为截断摘要，较完整内容位于 RSS 的 content:encoded 字段

  # 检索式：magnetocardiogra*[tiab] NOT (editorial[pt] OR comment[pt])
  - name: "PubMed 心磁 MCG"
    url: "https://pubmed.ncbi.nlm.nih.gov/rss/search/1VA-U_2oiXyq9lM7V8nTqPtFmJ8gqMPvbk5hRJ-yV23nzYWMec/?limit=50&utm_campaign=pubmed-2&fc=20260915110535"

  # 检索式：(magnetocardiogra*[tiab] OR magnetoencephalogra*[tiab] OR biomagnetic[tiab]) AND ("optically pumped"[tiab] OR "atomic magnetometer"[tiab] OR OPM[tiab] OR OPMs[tiab]) NOT (editorial[pt] OR comment[pt])
  - name: "PubMed 生物磁 OPM 测量"
    url: "https://pubmed.ncbi.nlm.nih.gov/rss/search/1FmSTaOY8T6WqVhJ-nPoe00_Rnior8OG0LCPR9xBUvXBTSJ9M3/?limit=50&utm_campaign=pubmed-2&fc=20260915110558"

  # 检索式：magnetoencephalogra*[tiab] AND (denois*[tiab] OR "noise suppression"[tiab] OR "source localization"[tiab] OR "source localisation"[tiab] OR "source reconstruction"[tiab] OR beamform*[tiab] OR "deep learning"[tiab] OR "machine learning"[tiab]) NOT ("trial protocol"[ti] OR "study protocol"[ti]) NOT (editorial[pt] OR comment[pt])
  - name: "PubMed 脑磁信号处理与源定位"
    url: "https://pubmed.ncbi.nlm.nih.gov/rss/search/1jye2CWYy7Vf8H3danwyY6zgYNUns4UqUVFdo9s21DHdnIeMcb/?limit=50&utm_campaign=pubmed-2&fc=20260915110839"

  # 检索式：(electrocardiogra*[tiab] OR ECG[tiab] OR EKG[tiab]) AND (denois*[tiab] OR "signal processing"[tiab] OR "deep learning"[tiab] OR "machine learning"[tiab] OR "self-supervised"[tiab] OR "foundation model"[tiab] OR "lead reconstruction"[tiab] OR delineation[tiab]) NOT (editorial[pt] OR comment[pt])
  - name: "PubMed 心电处理与 AI"
    url: "https://pubmed.ncbi.nlm.nih.gov/rss/search/1TYjWBTBfCClh7GHJ35AKQ8aHYadRB_zA8gjtnWkf9cqyhukz5/?limit=50&utm_campaign=pubmed-2&fc=20260915110644"

  # 检索式：(electroencephalogra*[tiab] OR EEG[tiab]) AND (denois*[tiab] OR "artifact removal"[tiab] OR "artefact removal"[tiab] OR "deep learning"[tiab] OR "machine learning"[tiab] OR "self-supervised"[tiab] OR "foundation model"[tiab] OR "neural decoding"[tiab]) NOT (editorial[pt] OR comment[pt])
  - name: "PubMed 脑电处理与 AI"
    url: "https://pubmed.ncbi.nlm.nih.gov/rss/search/1pAhYGWnaLE9wUGA2qUJ-his7hLwgvOUAQJSMOIDdk8RevqEK-/?limit=50&utm_campaign=pubmed-2&fc=20260915110710"

  # 检索式：(electrocardiogra*[tiab] OR ECG[tiab] OR magnetocardiogra*[tiab]) AND ("forward model"[tiab] OR "forward modeling"[tiab] OR "forward modelling"[tiab] OR "forward problem"[tiab] OR "inverse problem"[tiab] OR "finite element"[tiab] OR "boundary element"[tiab] OR "electrocardiographic imaging"[tiab]) NOT (editorial[pt] OR comment[pt])
  - name: "PubMed 心脏电磁正逆问题"
    url: "https://pubmed.ncbi.nlm.nih.gov/rss/search/1FKYAX__W2XxZYrWjROdpdcjcU66s0D0NEOmLsTUxyA120aspF/?limit=50&utm_campaign=pubmed-2&fc=20260915110736"

  # ── 心脑信号论文 / 专题订阅 ──────────────────────────

  - name: "Nature Magnetoencephalography"          # 脑磁专题；仍可能包含综述或编辑精选
    url: "https://www.nature.com/subjects/magnetoencephalography.rss"

  - name: "Nature Brain-machine Interface"          # 脑机接口专题；包含部分侵入式研究
    url: "https://www.nature.com/subjects/brain-machine-interface.rss"

  - name: "Journal of Neural Engineering"          # 神经信号、解码、建模与神经工程
    url: "https://iopscience.iop.org/journal/rss/1741-2552"

  - name: "Physiological Measurement"          # 生理测量与信号方法；包含其他生理信号
    url: "https://iopscience.iop.org/journal/rss/0967-3334"

  # ── 公开数据 / 基准 / 可复现实验工具 ──────────────────────────

  - name: "PhysioNet 数据与挑战更新"          # 公开生理数据、基准与挑战；含平台公告
    url: "https://physionet.org/feed.xml"

  - name: "MNE-Python 正式版本"          # EEG/MEG 预处理与源定位工具更新
    url: "https://github.com/mne-tools/mne-python/releases.atom"

  - name: "Braindecode 正式版本"          # 心脑信号深度学习模型与实现更新
    url: "https://github.com/braindecode/braindecode/releases.atom"

  - name: "MOABB 正式版本"          # EEG/BCI 数据集与统一评测流程
    url: "https://github.com/NeuroTechX/moabb/releases.atom"

  - name: "NeuroKit2 正式版本"          # ECG 等生理信号处理工具更新
    url: "https://github.com/neuropsychology/NeuroKit/releases.atom"


# ═══════════════════════════════════════════════════════════
# 三、ArXiv 论文订阅
#
# 检索说明：
#   ti = 标题；ab = 摘要。跨分类检索，避免只限 cs.LG/eess.SP 漏检
#   心磁/脑磁使用英文全称；不单独使用易产生歧义的 MCG/MEG 缩写
#   AI 方法均与心脑信号相交；不订阅通用视觉模型或泛临床疾病
#   沿用原配置的 + 分隔写法；%22...%22 表示完整短语
#   官方语法：https://info.arxiv.org/help/api/user-manual.html
# ═══════════════════════════════════════════════════════════

arxiv:

  # ── 心磁 / 脑磁 / 生物磁测量 ──────────────────────────

  - name: "心磁 MCG 原始研究"
    query: "(ti:magnetocardiography+OR+ab:magnetocardiography+OR+ti:magnetocardiogram+OR+ab:magnetocardiogram+OR+ti:magnetocardiographic+OR+ab:magnetocardiographic)"
    max_results: 4

  - name: "脑磁 MEG / OPM-MEG 原始研究"
    query: "(ti:magnetoencephalography+OR+ab:magnetoencephalography+OR+ti:magnetoencephalographic+OR+ab:magnetoencephalographic+OR+ti:%22OPM-MEG%22+OR+ab:%22OPM-MEG%22)"
    max_results: 4

  - name: "生物磁传感 OPM / SQUID / 金刚石"
    query: "(((ti:magnetocardiography+OR+ab:magnetocardiography+OR+ti:magnetocardiogram+OR+ab:magnetocardiogram+OR+ti:magnetocardiographic+OR+ab:magnetocardiographic)+OR+(ti:magnetoencephalography+OR+ab:magnetoencephalography+OR+ti:magnetoencephalographic+OR+ab:magnetoencephalographic+OR+ti:%22OPM-MEG%22+OR+ab:%22OPM-MEG%22))+OR+(ti:biomagnetic+OR+ab:biomagnetic+OR+ti:biomagnetism+OR+ab:biomagnetism))+AND+(ti:%22optically+pumped%22+OR+ab:%22optically+pumped%22+OR+ti:%22atomic+magnetometer%22+OR+ab:%22atomic+magnetometer%22+OR+ti:SQUID+OR+ab:SQUID+OR+ti:%22nitrogen+vacancy%22+OR+ab:%22nitrogen+vacancy%22+OR+ti:%22nitrogen-vacancy%22+OR+ab:%22nitrogen-vacancy%22)"
    max_results: 3

  - name: "生物磁屏蔽 / 磁场补偿 / 阵列校准"
    query: "(((ti:magnetocardiography+OR+ab:magnetocardiography+OR+ti:magnetocardiogram+OR+ab:magnetocardiogram+OR+ti:magnetocardiographic+OR+ab:magnetocardiographic)+OR+(ti:magnetoencephalography+OR+ab:magnetoencephalography+OR+ti:magnetoencephalographic+OR+ab:magnetoencephalographic+OR+ti:%22OPM-MEG%22+OR+ab:%22OPM-MEG%22))+OR+(ti:biomagnetic+OR+ab:biomagnetic))+AND+(ti:shielding+OR+ab:shielding+OR+ti:%22field+compensation%22+OR+ab:%22field+compensation%22+OR+ti:%22field+nulling%22+OR+ab:%22field+nulling%22+OR+ti:calibration+OR+ab:calibration+OR+ti:crosstalk+OR+ab:crosstalk+OR+ti:%22cross-talk%22+OR+ab:%22cross-talk%22+OR+ti:%22sensor+array%22+OR+ab:%22sensor+array%22)"
