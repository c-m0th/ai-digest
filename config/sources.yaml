    query: "((ti:magnetocardiography+OR+ab:magnetocardiography+OR+ti:magnetocardiogram+OR+ab:magnetocardiogram+OR+ti:magnetocardiographic+OR+ab:magnetocardiographic)+OR+(ti:magnetoencephalography+OR+ab:magnetoencephalography+OR+ti:magnetoencephalographic+OR+ab:magnetoencephalographic+OR+ti:%22OPM-MEG%22+OR+ab:%22OPM-MEG%22))+AND+(ti:denoising+OR+ab:denoising+OR+ti:%22noise+suppression%22+OR+ab:%22noise+suppression%22+OR+ti:%22interference+suppression%22+OR+ab:%22interference+suppression%22+OR+ti:%22artifact+removal%22+OR+ab:%22artifact+removal%22+OR+ti:%22artefact+removal%22+OR+ab:%22artefact+removal%22+OR+ti:%22signal+space+separation%22+OR+ab:%22signal+space+separation%22+OR+ti:%22homogeneous+field+correction%22+OR+ab:%22homogeneous+field+correction%22)"
