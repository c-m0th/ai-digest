# ═══════════════════════════════════════════════════════════
# 五、Hacker News 热帖过滤
# ═══════════════════════════════════════════════════════════

hackernews:
  enabled: true
  keywords:
    # 医学信号处理
    - "ECG"
    - "EEG"
    - "brain"
    - "cardiac"
    - "biosignal"
    - "wearable"
    - "medical AI"
    - "health AI"
    - "BCI"
    - "neuroscience"
    # 深度学习通用
    - "deep learning"
    - "transformer"
    - "neural network"
    - "machine learning"
    - "foundation model"
  min_score: 80                    # 医学类帖子分数偏低，适当降低门槛
  max_items: 4
